[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-a2ui"
version = "0.1.0"
description = "A clinic booking agent that answers with A2UI 1.0 interactive surfaces instead of walls of text — catalog-constrained UI, server-side data binding so patient PII never reaches the model, and a server-rendered HTML renderer."
requires-python = ">=3.10"
dependencies = [
    "a2ui-agent-sdk>=0.12.0",
    "litellm>=1.40",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
agent-a2ui = "agent_a2ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
